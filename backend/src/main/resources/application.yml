server:
  port: 8080

spring:
  application:
    name: pure-reader
  datasource:
    url: jdbc:mysql://localhost:3306/reader?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:10132}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    # HS256 要求密钥至少 32 字节，部署时请通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:cHVyZS1yZWFkZXItanN3dC1zZWNyZXQta2V5LTIwMjUtMDUtMDEtMTIzNDU2Nzg5MA==}
    expire-hours: 168
  fetch:
    pool-size: 10
    timeout-seconds: 10
    max-articles-per-source: 50
    # 信任所有 SSL 证书（部分站点证书不规范，开启后可抓取；有安全风险，默认关闭）
    trust-all-certs: false
  upload:
    # 封面图片本地存储目录（相对后端运行目录）
    dir: ./uploads
  rank:
    alpha: 0.5   # 源权重系数
    beta: 0.3    # 新鲜度系数
    gamma: 0.2   # 行为分系数
    time-half-life-hours: 24

logging:
  level:
    com.reader: info
